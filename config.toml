theme = "onedark"

[editor]
line-number = "relative"
cursorline = true
bufferline = "multiple"
color-modes = true
true-color = true
auto-completion = true
text-width = 100
rulers = [100]
auto-format = true
completion-trigger-len = 1
end-of-line-diagnostics = "hint"
popup-border = "all"

[editor.statusline]
left = ["mode", "spinner", "file-base-name", "read-only-indicator", "file-modification-indicator"]
center = ["version-control"]
right = ["diagnostics", "selections", "position", "position-percentage", "file-encoding", "file-line-ending", "file-type"]
separator = "|"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = true
git-global = true
git-exclude = true

[editor.search]
smart-case = true
wrap-around = true

[editor.indent-guides]
render = true
character = "|"
skip-levels = 1

[editor.lsp]
display-messages = true
display-inlay-hints = true
display-signature-help-docs = true

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "disable"

[editor.soft-wrap]
enable = false

[keys.normal]
w = "move_visual_line_up"
a = "move_char_left"
s = "move_visual_line_down"
d = "move_char_right"
q = "move_prev_word_start"
e = "move_next_word_start"
z = "move_prev_word_end"
x = "move_next_word_end"
h = ["extend_line_below", "yank", "collapse_selection"]
j = ["extend_line_below", "yank", "paste_after", "collapse_selection"]
J = ["extend_line_below", "yank", "paste_before", "collapse_selection"]
k = ["extend_line_below", "delete_selection"]
l = ["extend_line_below", "toggle_comments", "collapse_selection"]

"C-s" = ":write"
"C-r" = "insert_mode"
"C-e" = "select_mode"
"C-z" = "undo"
"C-c" = "yank_main_selection_to_clipboard"
"C-x" = "delete_selection"
"C-v" = "paste_clipboard_after"
"C-p" = "file_picker"
"C-b" = "buffer_picker"
tab = "goto_next_buffer"
"S-tab" = "goto_previous_buffer"
"C-f" = "global_search"
"C-d" = "diagnostics_picker"
"C-k" = "hover"

F5 = ":run-shell-command $HOME/.config/helix/scripts/hx-tmux-runner.sh run %{buffer_name}"
F6 = ":run-shell-command $HOME/.config/helix/scripts/hx-tmux-runner.sh build %{buffer_name}"
F7 = ":run-shell-command $HOME/.config/helix/scripts/hx-tmux-runner.sh test %{buffer_name}"

[keys.insert]
j = { k = "normal_mode" }
"A-j" = ["normal_mode", "extend_line_below", "yank", "paste_after", "collapse_selection", "insert_mode"]
"A-J" = ["normal_mode", "extend_line_below", "yank", "paste_before", "collapse_selection", "insert_mode"]
"C-s" = ":write"
"C-space" = "completion"
"C-n" = "completion"
"C-r" = "normal_mode"

[keys.select]
w = "extend_visual_line_up"
a = "extend_char_left"
s = "extend_visual_line_down"
d = "extend_char_right"
j = ["yank", "paste_after"]
J = ["yank", "paste_before"]
"C-s" = ":write"
"C-e" = "normal_mode"
"C-z" = "undo"
"C-c" = "yank_main_selection_to_clipboard"
"C-v" = "paste_clipboard_after"
"C-x" = "delete_selection"

[keys.normal.space]
q = "yank_main_selection_to_clipboard"
w = "delete_selection"
e = "paste_clipboard_after"

a = "code_action"
d = "goto_next_buffer"
s = "buffer_picker"
f = "global_search"
r = "rename_symbol"
c = "hover"
z = "goto_definition"
v = "goto_reference"
t = ":config-open"
u = ":run-shell-command $HOME/.config/helix/scripts/hx-tmux-runner.sh toggle %{buffer_name}"
i = ":run-shell-command $HOME/.config/helix/scripts/hx-tmux-runner.sh focus-run %{buffer_name}"
o = ":run-shell-command $HOME/.config/helix/scripts/hx-tmux-runner.sh focus-build %{buffer_name}"

[keys.normal.space.R]
r = ":rl"
a = ":rla"
c = ":config-reload"

[keys.select.space]
q = "yank_main_selection_to_clipboard"
w = "delete_selection"
e = "paste_clipboard_after"
