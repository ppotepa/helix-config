# Overrides for common languages.
# Helix merges this file with the built-in `languages.toml`.

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.csharp-ls]
command = "csharp-ls"

[language-server.taplo]
command = "taplo"

[language-server.sqls]
command = "sqls"

[language-server.ruby-lsp]
command = "ruby-lsp"

[language-server.haskell-language-server-wrapper]
command = "haskell-language-server-wrapper"
args = ["--lsp"]

[language-server.dart-language-server]
command = "dart"
args = ["language-server", "--protocol=lsp"]

[language-server.tinymist]
command = "tinymist"

[language-server.zls]
command = "zls"

[[language]]
name = "rust"
auto-format = true
rulers = [100]

[[language]]
name = "go"
auto-format = true
rulers = [100]
language-servers = ["gopls", "golangci-lint-lsp"]

[[language]]
name = "python"
auto-format = true
rulers = [88]
indent = { tab-width = 4, unit = "    " }
language-servers = ["pyright", "ruff"]

[[language]]
name = "javascript"
auto-format = true
rulers = [100]
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "typescript"
auto-format = true
rulers = [100]
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "jsx"
auto-format = true
rulers = [100]
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "tsx"
auto-format = true
rulers = [100]
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "json"
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "yaml"
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = ["yaml-language-server", "ansible-language-server"]

[[language]]
name = "toml"
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = ["taplo"]

[[language]]
name = "bash"
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "lua"
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = ["lua-language-server"]

[[language]]
name = "nix"
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "html"
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = ["vscode-html-language-server"]

[[language]]
name = "css"
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "scss"
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "markdown"
text-width = 100
indent = { tab-width = 2, unit = "  " }
language-servers = ["marksman", "markdown-oxide"]

[[language]]
name = "c-sharp"
auto-format = true
language-servers = ["csharp-ls"]

[[language]]
name = "sql"
auto-format = true
language-servers = ["sqls"]

[[language]]
name = "ruby"
auto-format = true
language-servers = ["ruby-lsp"]

[[language]]
name = "haskell"
auto-format = true
language-servers = ["haskell-language-server-wrapper"]

[[language]]
name = "dart"
auto-format = true
language-servers = ["dart-language-server"]

[[language]]
name = "typst"
auto-format = true
language-servers = ["tinymist"]

[[language]]
name = "zig"
auto-format = true
language-servers = ["zls"]
